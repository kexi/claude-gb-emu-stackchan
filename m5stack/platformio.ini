[env:m5stack-cores3]
platform = espressif32@6.7.0
board = m5stack-cores3
framework = arduino
board_build.embed_files = data/kantan-gb-play.gbc
lib_deps =
    m5stack/M5Unified@0.2.15
    gb-core=symlink://../core
build_unflags = -std=gnu++11 -Os
build_flags = -std=gnu++17 -O2 -DGB_EMBEDDED -DBOARD_HAS_PSRAM
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub

[env:m5stack-cores3-profile]
extends = env:m5stack-cores3
build_flags = ${env:m5stack-cores3.build_flags} -DGB_PROFILE
